name: Integration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/**"
      - ".github/workflows/integration.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/**"
      - ".github/workflows/integration.yml"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  smoke-and-golden:
    runs-on: big
    timeout-minutes: 30
    env:
      NAUTOBOT_URL: http://localhost:8000
      SUPERUSER_API_TOKEN: ci-superuser-api-token
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nautobot
          POSTGRES_USER: nautobot
          POSTGRES_PASSWORD: nautobot
        options: >-
          --health-cmd "pg_isready -U nautobot -d nautobot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      nautobot:
        image: ghcr.io/nautobot/nautobot:2.4.27
        env:
          NAUTOBOT_DB_HOST: postgres
          NAUTOBOT_DB_NAME: nautobot
          NAUTOBOT_DB_USER: nautobot
          NAUTOBOT_DB_PASSWORD: nautobot
          NAUTOBOT_REDIS_HOST: redis
          NAUTOBOT_SECRET_KEY: thisisaverylongfixedsecretkeyforciandtestingonly123
          NAUTOBOT_CREATE_SUPERUSER: "true"
          NAUTOBOT_SUPERUSER_API_TOKEN: ci-superuser-api-token
          NAUTOBOT_ALLOWED_HOSTS: "*"
        ports:
          - 8000:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Wait for Nautobot readiness
        env:
          NAUTOBOT_TOKEN: ci-superuser-api-token
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            if curl -fsS \
              -H "Authorization: Token ${NAUTOBOT_TOKEN}" \
              "${NAUTOBOT_URL}/api/status/" >/dev/null; then
              echo "Nautobot is ready after ${i} checks"
              exit 0
            fi
            sleep 5
          done

          echo "Nautobot failed readiness checks; dumping recent service logs"
          docker logs "${{ job.services.nautobot.id }}" --tail 200 || true
          exit 1

      - name: Run client smoke tests
        env:
          NAUTOBOT_TOKEN: ci-superuser-api-token
          NAUTOBOT_INSECURE: "1"
        run: ./scripts/run_smoke.sh

      - name: Run CLI golden tests
        env:
          NAUTOBOT_TOKEN: ci-superuser-api-token
          NAUTOBOT_INSECURE: "1"
        run: cargo test -p nautobot-cli --test golden -- --ignored
