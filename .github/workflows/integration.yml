name: Integration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/**"
      - ".github/workflows/integration.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/**"
      - ".github/workflows/integration.yml"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  smoke-and-golden:
    runs-on: big
    timeout-minutes: 30
    env:
      NAUTOBOT_URL: http://localhost:8000
      SUPERUSER_API_TOKEN: ci-superuser-api-token
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nautobot
          POSTGRES_USER: nautobot
          POSTGRES_PASSWORD: nautobot
        options: >-
          --health-cmd "pg_isready -U nautobot -d nautobot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      nautobot:
        image: ghcr.io/nautobot/nautobot:3.1.2
        env:
          NAUTOBOT_DB_HOST: postgres
          NAUTOBOT_DB_NAME: nautobot
          NAUTOBOT_DB_USER: nautobot
          NAUTOBOT_DB_PASSWORD: nautobot
          NAUTOBOT_REDIS_HOST: redis
          NAUTOBOT_SECRET_KEY: thisisaverylongfixedsecretkeyforciandtestingonly123
          NAUTOBOT_CREATE_SUPERUSER: "true"
          NAUTOBOT_SUPERUSER_API_TOKEN: ci-superuser-api-token
          NAUTOBOT_SUPERUSER_PASSWORD: ci-superuser-password
          NAUTOBOT_ALLOWED_HOSTS: "*"
        ports:
          - 8000:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: kunobi-ninja/kache-action@v1
        with:
          cache-key-prefix: kache-smoke-and-golden

      - name: Wait for Nautobot readiness
        env:
          NAUTOBOT_TOKEN: ci-superuser-api-token
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            if curl -fsS \
              -H "Authorization: Token ${NAUTOBOT_TOKEN}" \
              "${NAUTOBOT_URL}/api/status/" >/dev/null; then
              echo "Nautobot is ready after ${i} checks"
              exit 0
            fi
            sleep 5
          done

          echo "Nautobot failed readiness checks; dumping recent service logs"
          docker logs "${{ job.services.nautobot.id }}" --tail 200 || true
          exit 1

      - name: Install oasdiff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(gh api repos/tufin/oasdiff/releases/latest \
            --jq '.assets[] | select(.name | test("linux_amd64.tar.gz")) | .browser_download_url')
          curl -sSfL "$url" | tar -xz -C /usr/local/bin

      - name: Fetch live OpenAPI schema
        env:
          NAUTOBOT_TOKEN: ci-superuser-api-token
        run: |
          curl -sf "${NAUTOBOT_URL}/api/swagger.json" \
            -H "Authorization: Token ${NAUTOBOT_TOKEN}" \
            -o /tmp/live-schema.json

      - name: Check OpenAPI schema for breaking changes
        run: |
          # Nautobot's schema contains semantically duplicate paths with different
          # parameter names (e.g. /foo/{id}/ and /foo/{name}/), which oasdiff
          # rejects. Deduplicate by keeping the first path for each normalised
          # pattern before comparing.
          python3 <<'PY'
          import json, re

          def norm(p):
              return re.sub(r'\{[^}]+\}', '{p}', p)

          def dedup(src, dst):
              with open(src) as f:
                  schema = json.load(f)
              seen, paths = set(), {}
              for path, methods in schema.get('paths', {}).items():
                  n = norm(path)
                  if n not in seen:
                      seen.add(n)
                      paths[path] = methods
              schema['paths'] = paths
              with open(dst, 'w') as f:
                  json.dump(schema, f)

          dedup('scripts/openapi-schema.json', '/tmp/base-deduped.json')
          dedup('/tmp/live-schema.json', '/tmp/live-deduped.json')
          PY

          oasdiff breaking /tmp/base-deduped.json /tmp/live-deduped.json --fail-on ERR

      - name: Upload live schema
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openapi-schema
          path: /tmp/live-schema.json

      - name: Run client smoke tests
        env:
          NAUTOBOT_TOKEN: ci-superuser-api-token
          NAUTOBOT_INSECURE: "1"
        run: ./scripts/run_smoke.sh

      - name: Run CLI golden tests
        env:
          NAUTOBOT_TOKEN: ci-superuser-api-token
          NAUTOBOT_INSECURE: "1"
        run: cargo test -p nautobot-cli --test golden -- --ignored
