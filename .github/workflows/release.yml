name: release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RUSTFLAGS: "-C debuginfo=0"
      CARGO_TARGET_DIR: target/ci
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-release
          cache-targets: true

      - name: doc build
        env:
          RUSTDOCFLAGS: "--cfg docsrs"
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo doc --workspace --all-features --no-deps

      # scoped to the hand-written crates, as ci's test job is: nautobot-openapi
      # is generated and carries no tests, so an unscoped run only builds a test
      # harness for 18mb of generated source alongside the rest, and the runner
      # dies partway through with a sigterm.
      - name: run tests
        run: cargo test -p nautobot -p nautobot-cli

      - name: install sbom tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: generate sbom
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          for manifest in "$GITHUB_WORKSPACE"/crates/*/Cargo.toml; do
            crate="$(basename "$(dirname "$manifest")")"
            (cd /tmp && cargo cyclonedx --manifest-path "$manifest" \
              --format json \
              --override-filename "sbom-${REF_NAME}-${crate}.cdx" \
              --all-features)
          done

      - name: collect and clean sbom files
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/nautobot-sbom

          # Collect SBOMs emitted in /tmp.
          find /tmp -maxdepth 1 -type f -name "sbom-${REF_NAME}-*.cdx.json" \
            -exec cp {} /tmp/nautobot-sbom/ \;

          # Some cargo-cyclonedx invocations can emit next to manifests; collect then remove.
          find "$GITHUB_WORKSPACE" -type f -name "sbom-${REF_NAME}-*.cdx.json" \
            -exec cp {} /tmp/nautobot-sbom/ \; \
            -delete

      - name: upload sbom
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.ref_name }}
          path: "/tmp/nautobot-sbom/sbom-${{ github.ref_name }}-*.cdx.json"
          if-no-files-found: error

      - name: attach sbom to release
        uses: softprops/action-gh-release@v3
        with:
          files: /tmp/nautobot-sbom/sbom-${{ github.ref_name }}-*.cdx.json

      - name: publish nautobot-openapi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p nautobot-openapi --no-verify

      - name: publish nautobot
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p nautobot --no-verify

      - name: publish nautobot-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p nautobot-cli --no-verify
